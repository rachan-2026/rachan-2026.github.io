<!doctype html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Rachel — Portfolio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="theme-color" content="#F7F4ED" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet" />

        <style>
            :root {
                /* Portfolio palette */
                --oat: #f7f4ed;
                --linen: #d8d0c1;
                --sage: #9daa92;
                --charcoal: #373a33;
                --muted: #5e6158;
                --sage-ink: #4e5e47;
                --clay-ink: #8a5a44;
                /* Portfolio type */
                --display: "Plus Jakarta Sans", system-ui, sans-serif;
                --sans: "Inter", system-ui, sans-serif;
            }

            * { box-sizing: border-box; }
            .hidden { display: none !important; }

            .staticrypt-html, .staticrypt-body {
                margin: 0;
                min-height: 100%;
                background: var(--oat);
                color: var(--charcoal);
                font-family: var(--sans);
                -webkit-font-smoothing: antialiased;
            }

            /* Brief loading state while a remembered password decrypts */
            .staticrypt-spinner-container {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                background: var(--oat);
            }
            .staticrypt-spinner {
                width: 24px;
                height: 24px;
                border-radius: 50%;
                border: 2px solid var(--linen);
                border-top-color: var(--charcoal);
                animation: spin 0.8s linear infinite;
            }
            @keyframes spin { to { transform: rotate(360deg); } }

            .lock-page {
                min-height: 100vh;
                min-height: 100dvh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 32px 20px;
                text-align: center;
            }

            .lock-icon {
                display: grid;
                place-items: center;
                width: 52px;
                height: 52px;
                border: 1.5px solid var(--sage);
                border-radius: 50%;
                color: var(--sage);
            }
            .lock-icon svg { width: 18px; height: 20px; display: block; }

            /* Body size (16/24) in the display face, Medium */
            .lock-label {
                margin: 28px 0 0;
                font-family: var(--display);
                font-size: 16px;
                line-height: 24px;
                font-weight: 500;
                letter-spacing: 0.01em;
                color: var(--charcoal);
            }

            form { position: relative; margin-top: 24px; width: 100%; max-width: 260px; }

            .password-frame {
                position: relative;
                display: flex;
                align-items: center;
                height: 46px;
                padding: 3px;
                border: 1.5px solid var(--charcoal);
                background: var(--oat);
                transition: border-color 0.15s ease, box-shadow 0.15s ease;
            }

            #staticrypt-password {
                flex: 1;
                min-width: 0;
                height: 100%;
                padding: 0 12px;
                border: 0;
                background: transparent;
                color: var(--charcoal);
                font-family: var(--sans);
                font-size: 14px;   /* Small 14/20 */
                line-height: 20px;
                outline: none;
            }
            #staticrypt-password::placeholder { color: var(--muted); }

            .submit-arrow {
                display: grid;
                place-items: center;
                width: 36px;
                height: 100%;
                padding: 0;
                border: 0;
                background: transparent;
                color: var(--muted);
                cursor: pointer;
                transition: color 0.15s ease, transform 0.15s ease;
            }
            .submit-arrow svg { width: 18px; height: 12px; display: block; }
            .submit-arrow:hover,
            .password-frame:focus-within .submit-arrow { color: var(--charcoal); }
            .submit-arrow:hover { transform: translateX(2px); }

            /* Focus: the frame itself turns sage-ink and thickens slightly */
            .password-frame:focus-within {
                border-color: var(--sage-ink);
                box-shadow: 0 0 0 1px var(--sage-ink);
            }
            .password-frame.is-error,
            .password-frame.is-error:focus-within {
                border-color: var(--clay-ink);
                box-shadow: 0 0 0 1px var(--clay-ink);
            }

            /* Small 14/20 Inter Medium */
            .lock-error {
                position: absolute;   /* sits below the field without shifting the layout */
                top: 100%;
                left: 0;
                margin: 8px 0 0;
                text-align: left;     /* aligns with the field's left edge */
                white-space: nowrap;
                font-size: 14px;
                line-height: 20px;
                font-weight: 500;
                color: var(--clay-ink);
            }

            /* On narrow screens, wrap the message within the field's width */
            @media (max-width: 480px) {
                .lock-error { white-space: normal; right: 0; }
            }

            /* A short shake draws the eye to the field on a wrong password */
            .password-frame.shake { animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
            @keyframes shake {
                15%, 85% { transform: translateX(-2px); }
                30%, 70% { transform: translateX(4px); }
                45% { transform: translateX(-6px); }
                55% { transform: translateX(6px); }
            }

            @media (prefers-reduced-motion: reduce) {
                .staticrypt-spinner { animation-duration: 2s; }
                .submit-arrow:hover { transform: none; }
                .password-frame.shake { animation: none; }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container" role="status" aria-label="Loading">
            <div class="staticrypt-spinner"></div>
        </div>

        <div id="staticrypt_content" class="hidden">
            <main class="lock-page">
                <div class="lock-icon" aria-hidden="true">
                    <svg viewBox="0 0 18 20" fill="currentColor">
                        <path d="M9 0.75a5.25 5.25 0 0 0-5.25 5.25v2.25H3a2 2 0 0 0-2 2v7.75a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10.25a2 2 0 0 0-2-2h-.75V6A5.25 5.25 0 0 0 9 .75Zm-3.25 7.5V6a3.25 3.25 0 1 1 6.5 0v2.25h-6.5Z" />
                    </svg>
                </div>

                <h1 class="lock-label">Please enter password</h1>

                <form id="staticrypt-form" action="#" method="post" novalidate>
                    <div class="password-frame" id="password-frame">
                        <label for="staticrypt-password" class="hidden">Password</label>
                        <input
                            id="staticrypt-password"
                            type="password"
                            name="password"
                            placeholder="Password"
                            aria-label="Password"
                            aria-describedby="staticrypt-error"
                            autocomplete="current-password"
                            required
                            autofocus
                        />
                        <button type="button" id="staticrypt-submit" class="submit-arrow" aria-label="Unlock portfolio">
                            <svg viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 6h16M12 1l5 5-5 5" />
                            </svg>
                        </button>
                    </div>
                    <p id="staticrypt-error" class="lock-error hidden" role="alert">Password is incorrect. Please try again.</p>

                    <!-- "Remember me" is always on and hidden, so visitors enter the password only once.
                         StatiCrypt still needs the checkbox to exist. -->
                    <label id="staticrypt-remember-label" class="hidden">
                        <input id="staticrypt-remember" type="checkbox" name="remember" checked />
                        Remember me
                    </label>
                </form>
            </main>
        </div>

        <script>
            // Some embedded viewers and private browsing modes block localStorage.
            // StatiCrypt reads it on load, so fall back to in-memory storage
            // instead of stalling on the loading spinner.
            const localStorage = (function () {
                try {
                    const store = window.localStorage;
                    const probe = "__staticrypt_probe__";
                    store.setItem(probe, "1");
                    store.removeItem(probe);
                    return store;
                } catch (e) {
                    const memory = {};
                    return {
                        getItem: (k) => (k in memory ? memory[k] : null),
                        setItem: (k, v) => { memory[k] = String(v); },
                        removeItem: (k) => { delete memory[k]; },
                        clear: () => { for (const k in memory) delete memory[k]; },
                    };
                }
            })();
        </script>
